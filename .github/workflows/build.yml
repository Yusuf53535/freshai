name: Build Real Native iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Setup CocoaPods
        run: sudo gem install cocoapods

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/FreshAI.xcworkspace \
            -scheme FreshAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Real IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/FreshAI.app Payload/
          zip -r FreshAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshAI-IPA
          path: FreshAI.ipa
