name: Build Native iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Export Expo Bundle
        run: |
          mkdir -p ios/Payload/FreshAI.app
          npx expo export --platform ios --output-dir ios/Payload/FreshAI.app

      - name: Generate Minimal Info.plist
        run: |
          cat << 'EOF' > ios/Payload/FreshAI.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>FreshAI</string>
              <key>CFBundleIdentifier</key>
              <string>com.freshai.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>FreshAI</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Create Dummy Executable
        run: |
          echo '#!/bin/sh' > ios/Payload/FreshAI.app/FreshAI
          chmod +x ios/Payload/FreshAI.app/FreshAI

      - name: Create IPA Package
        run: |
          cd ios
          zip -r FreshAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshAI-IPA
          path: ios/FreshAI.ipa
