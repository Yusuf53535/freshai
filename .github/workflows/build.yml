name: Build Native iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Export Expo Bundle
        run: |
          mkdir -p ios/Payload/FreshAI.app
          npx expo export --platform ios --output-dir ios/Payload/FreshAI.app

      - name: Create IPA Package
        run: |
          cd ios
          zip -r FreshAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshAI-IPA
          path: ios/FreshAI.ipa
